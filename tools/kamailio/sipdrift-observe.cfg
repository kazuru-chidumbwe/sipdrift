#!KAMAILIO
# sipdrift minimal observe listener — UDP 127.0.0.1:5090

children=1
debug=2
log_stderror=yes
memdbg=0
memlog=0
auto_bind_ipv6=0

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"
run_dir="/tmp/sipdrift-kamailio-run"
listen=udp:127.0.0.1:5090

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "app_lua.so"

modparam("app_lua", "load", "/opt/atlas/repos/sipdrift/tools/kamailio/sipdrift_observe.lua")

request_route {
    lua_run("ksr_request_route");
}

onreply_route {
    lua_run("ksr_reply_route");
}
