[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipdrift"
version = "0.3.3"
description = "Differential testing harness for open-source SIP/VoIP stacks (parse-oracle and lab drivers)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Seke Kazuru", email = "kazuruuni@gmail.com" }]
keywords = ["sip", "voip", "differential-testing", "interoperability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sipdrift = "sipdrift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sipdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
