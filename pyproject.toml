[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipdrift"
version = "0.1.0"
description = "Differential testing scaffold for open-source SIP/VoIP stacks (early development)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kazuru" }]
keywords = ["sip", "voip", "differential-testing", "joss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Telephony",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sipdrift = "sipdrift.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sipdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
