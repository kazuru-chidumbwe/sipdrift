name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@83679a5e8f9ae3002634bc6361d8e6838c0f5dcc # v6.1.0
        with:
          python-version: "3.11"

      - name: Install package and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest
